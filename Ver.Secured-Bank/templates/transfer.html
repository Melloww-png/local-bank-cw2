{% extends "base.html" %}
{% block title %}Transfer money | Mellow's Bank{% endblock %}
{% block content %}
<h1>Send money</h1>
<p class="intro">Available balance: {{ g.user.balance_cents | money }}</p>
<form class="form" method="POST" action="{{ url_for('transfer') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="recipient">Recipient username</label>
    <input id="recipient" name="recipient" maxlength="32" placeholder="user2" required>
    <label for="amount">Amount in SGD</label>
    <input type="number" id="amount" name="amount" min="0.01" step="0.01" required>
    <button class="button" type="submit">Send money</button>
</form>
{% endblock %}
