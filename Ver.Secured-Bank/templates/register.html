{% extends "base.html" %}
{% block title %}Create an account | Mellow's Bank{% endblock %}
{% block content %}
<h1>Create an account</h1>
<p class="intro">Use fictional details for your test account.</p>
<form class="form" method="POST" action="{{ url_for('register') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="full_name">Full name</label>
    <input id="full_name" name="full_name" maxlength="120" autocomplete="name"
           value="{{ request.form.get('full_name', '') }}" required>
    <label for="username">Username</label>
    <input id="username" name="username" minlength="3" maxlength="32"
           pattern="[A-Za-z0-9_]{3,32}" autocomplete="username"
           value="{{ request.form.get('username', '') }}" required>
    <label for="email">Email</label>
    <input type="email" id="email" name="email" maxlength="254"
           value="{{ request.form.get('email', '') }}" required>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" minlength="8"
           maxlength="128" autocomplete="new-password" required>
    <label for="confirm_password">Confirm password</label>
    <input type="password" id="confirm_password" name="confirm_password"
           minlength="8" maxlength="128" autocomplete="new-password" required>
    <button class="button" type="submit">Create account</button>
</form>
<p>Already registered? <a href="{{ url_for('login') }}">Sign in</a>.</p>
{% endblock %}
