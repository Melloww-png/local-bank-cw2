<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an account | Bank</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="container">
        <a class="brand" href="{{ url_for('home') }}">Bank</a>
        <span>Coursework demo</span>
    </header>

    <main class="container">
        <h1>Create an account</h1>
        <p class="intro">Use fictional details for your test account.</p>

        {% if error %}
            <p class="form-error" role="alert">{{ error }}</p>
        {% endif %}

        <form class="auth-form"
              method="POST"
              action="{{ url_for('register') }}">

            <div class="form-field">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    minlength="3"
                    maxlength="32"
                    pattern="[A-Za-z0-9_]{3,32}"
                    autocomplete="username"
                    value="{{ username | default('') }}"
                    required
                >
                <small>Use 3–32 letters, numbers, or underscores.</small>
            </div>

            <div class="form-field">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    maxlength="254"
                    autocomplete="email"
                    value="{{ email | default('') }}"
                    required
                >
            </div>

            <div class="form-field">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    minlength="8"
                    maxlength="128"
                    autocomplete="new-password"
                    required
                >
                <small>Use at least 8 characters.</small>
            </div>

            <div class="form-field">
                <label for="confirm_password">Confirm password</label>
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    minlength="8"
                    maxlength="128"
                    autocomplete="new-password"
                    required
                >
            </div>

            <button type="submit">Create account</button>
        </form>

        <p><a href="{{ url_for('home') }}">Back to homepage</a></p>
    </main>

    <footer class="container">
        Demo only. No real money or personal details.
    </footer>
</body>
</html>
