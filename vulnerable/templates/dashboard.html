<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your account | Mellow's Bank</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="container">
        <a class="brand" href="{{ url_for('home') }}">Mellow's Bank</a>

        <form method="POST" action="{{ url_for('logout') }}">
            <button type="submit">Log out</button>
        </form>
    </header>

    <main class="container">
        <h1>Hello, {{ user.username }}</h1>
        <p class="intro">Your test account overview.</p>

        <section class="account-count" aria-labelledby="balance-title">
            <h2 id="balance-title">Account balance</h2>

            <p class="number">
                SGD {{ "{:,.2f}".format(user.balance_cents / 100) }}
            </p>

            <dl>
                <dt>Credit score</dt>
                <dd>{{ user.credit_score }}</dd>

                <dt>Email</dt>
                <dd>{{ user.email }}</dd>

                <dt>Account ID</dt>
                <dd>{{ user.id }}</dd>
            </dl>
        </section>
    </main>

    <footer class="container">
        Demo only. No real money or personal details.
    </footer>
</body>
</html>
